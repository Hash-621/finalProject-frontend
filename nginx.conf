server {
    listen 80;
    
    # 리액트 빌드 파일 위치
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # 중요: 새로고침 시 404 에러 방지 (모든 요청을 index.html로 보냄)
        try_files $uri $uri/ /index.html;
    }
    
    # 선택사항: 백엔드 API 프록시 설정 (CORS 문제 해결용)
    # location /api {
    #     proxy_pass http://backend-container-name:8080;
    # }
}